name: Update ETF Holdings

on:
  schedule:
    - cron: '10 10 * * 1-5'  # 18:10 台灣時間,主要排程
    - cron: '0 15 * * 1-5'   # 23:00 台灣時間,備援排程(避免主排程被 GitHub 延遲而錯過當天資料)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch holdings
        run: python scripts/fetch_holdings.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Update ETF holdings data"
          git push
